<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#183d32">
    <title>Votre tirage | Secret</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
  </head>
  <body data-page="secret">
    <a class="skip-link" href="#main">Aller au contenu</a>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Secret, accueil">
        <span class="brand-mark" aria-hidden="true">✳</span>
        <span>Secret</span>
      </a>
      <span class="header-note">Une attribution rien qu’à vous.</span>
    </header>

    <main id="main" class="secret-shell">
      <section id="secret-card" class="secret-card" aria-live="polite">
        <div class="secret-decoration" aria-hidden="true">✳</div>
        <p id="secret-eyebrow" class="eyebrow">Votre tirage</p>
        <h1 id="secret-event" class="secret-event">Un cadeau à offrir…</h1>
        <div class="secret-divider" aria-hidden="true"><span>✦</span></div>
        <div id="secret-content"></div>
        <p id="secret-error" class="secret-error" role="alert" hidden>Ce lien de tirage est invalide ou corrompu. Veuillez demander à l’organisateur de vous renvoyer votre lien.</p>
        <a class="back-link" href="index.html">← Retour à l’accueil</a>
      </section>
      <p class="secret-footer">Gardez votre attribution secrète <span aria-hidden="true">✦</span></p>
    </main>
  </body>
</html>
